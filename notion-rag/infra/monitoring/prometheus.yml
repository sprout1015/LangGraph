global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # RAG API 서버 메트릭
  - job_name: "rag-api"
    static_configs:
      # Docker 내부에서 host.docker.internal로 로컬호스트 접근
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Prometheus 자체 메트릭
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
