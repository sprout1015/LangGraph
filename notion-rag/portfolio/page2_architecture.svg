<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    </style>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00C9A7"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="5" height="1080" fill="#00C9A7"/>

  <!-- ===== HEADER ===== -->
  <text x="60" y="56" font-size="13" fill="#94A3B8" letter-spacing="3" font-weight="500">PROJECT 03 - ARCHITECTURE</text>
  <text x="60" y="106" font-size="48" fill="#0F172A" font-weight="700">Notion RAG  –  시스템 구조도</text>
  <line x1="60" y1="122" x2="1860" y2="122" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ===================================== -->
  <!-- LEFT PANEL: 인덱싱 파이프라인          -->
  <!-- ===================================== -->
  <rect x="60" y="140" width="580" height="730" fill="#EFF6FF" rx="12" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="350" y="178" font-size="13" fill="#3B82F6" font-weight="700" letter-spacing="2" text-anchor="middle">인덱싱 파이프라인  (1회 또는 주기적)</text>

  <!-- Box: Notion Pages -->
  <rect x="115" y="200" width="470" height="72" fill="#DBEAFE" rx="8" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="350" y="232" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="middle">Notion Pages</text>
  <text x="350" y="256" font-size="13" fill="#3B82F6" text-anchor="middle">Notion Integration API</text>

  <!-- Arrow down -->
  <line x1="350" y1="272" x2="350" y2="316" stroke="#93C5FD" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="248" y="282" width="204" height="24" fill="#DBEAFE" rx="4"/>
  <text x="350" y="299" font-size="11" fill="#3B82F6" text-anchor="middle">NotionRecursiveLoader</text>

  <!-- Box: Text Splitter -->
  <rect x="115" y="320" width="470" height="72" fill="#DBEAFE" rx="8" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="350" y="352" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="middle">Text Splitter</text>
  <text x="350" y="376" font-size="13" fill="#3B82F6" text-anchor="middle">청크 500자  /  오버랩 100자</text>

  <!-- Arrow down -->
  <line x1="350" y1="392" x2="350" y2="440" stroke="#93C5FD" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Box: Embedding Model -->
  <rect x="115" y="444" width="470" height="72" fill="#DBEAFE" rx="8" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="350" y="476" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="middle">Embedding Model</text>
  <text x="350" y="500" font-size="13" fill="#3B82F6" text-anchor="middle">OpenAI  /  HuggingFace (로컬 폴백)</text>

  <!-- Arrow down from Embedding to pgvector label -->
  <line x1="350" y1="516" x2="350" y2="560" stroke="#93C5FD" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="350" y="548" font-size="11" fill="#3B82F6" text-anchor="middle">벡터 변환 후 저장</text>

  <!-- Connecting arrow from left panel to center pgvector -->
  <line x1="640" y1="596" x2="740" y2="596" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>

  <!-- ===================================== -->
  <!-- CENTER: 벡터 저장소                   -->
  <!-- ===================================== -->
  <rect x="750" y="540" width="420" height="120" fill="#F3E8FF" rx="12" stroke="#C4B5FD" stroke-width="2"/>
  <text x="960" y="574" font-size="14" fill="#6D28D9" font-weight="700" text-anchor="middle">벡터 저장소</text>
  <text x="960" y="600" font-size="17" fill="#4C1D95" font-weight="700" text-anchor="middle">PostgreSQL + pgvector</text>
  <text x="960" y="626" font-size="13" fill="#7C3AED" text-anchor="middle">( 또는 ChromaDB )</text>

  <!-- Arrow from center to right panel -->
  <line x1="1170" y1="596" x2="1270" y2="596" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>

  <!-- ===================================== -->
  <!-- RIGHT PANEL: 질의·응답 파이프라인     -->
  <!-- ===================================== -->
  <rect x="1280" y="140" width="580" height="730" fill="#F0FEFA" rx="12" stroke="#6EE7D4" stroke-width="1.5"/>
  <text x="1570" y="178" font-size="13" fill="#00C9A7" font-weight="700" letter-spacing="2" text-anchor="middle">질의 · 응답 파이프라인  (요청마다 실행)</text>

  <!-- Box: User Query -->
  <rect x="1335" y="200" width="470" height="72" fill="#CCFBF1" rx="8" stroke="#6EE7D4" stroke-width="1.5"/>
  <text x="1570" y="232" font-size="15" fill="#0F766E" font-weight="700" text-anchor="middle">사용자 질문</text>
  <text x="1570" y="256" font-size="13" fill="#0D9488" text-anchor="middle">Gradio UI  /  FastAPI  /  Discord Bot</text>

  <!-- Arrow down -->
  <line x1="1570" y1="272" x2="1570" y2="316" stroke="#6EE7D4" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect x="1468" y="282" width="204" height="24" fill="#CCFBF1" rx="4"/>
  <text x="1570" y="299" font-size="11" fill="#0D9488" text-anchor="middle">질문 임베딩 (동일 모델)</text>

  <!-- Box: Similarity Search -->
  <rect x="1335" y="320" width="470" height="72" fill="#CCFBF1" rx="8" stroke="#6EE7D4" stroke-width="1.5"/>
  <text x="1570" y="352" font-size="15" fill="#0F766E" font-weight="700" text-anchor="middle">유사도 검색</text>
  <text x="1570" y="376" font-size="13" fill="#0D9488" text-anchor="middle">score_threshold 필터링  ·  Top-K 문서 추출</text>

  <!-- Arrow down -->
  <line x1="1570" y1="392" x2="1570" y2="440" stroke="#6EE7D4" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Box: RAG Chain -->
  <rect x="1335" y="444" width="470" height="72" fill="#CCFBF1" rx="8" stroke="#6EE7D4" stroke-width="1.5"/>
  <text x="1570" y="476" font-size="15" fill="#0F766E" font-weight="700" text-anchor="middle">RAG Chain  (LangChain)</text>
  <text x="1570" y="500" font-size="13" fill="#0D9488" text-anchor="middle">검색 문서 + 질문 → 프롬프트 구성</text>

  <!-- Arrow down -->
  <line x1="1570" y1="516" x2="1570" y2="560" stroke="#6EE7D4" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Box: LLM -->
  <rect x="1335" y="564" width="470" height="72" fill="#CCFBF1" rx="8" stroke="#6EE7D4" stroke-width="1.5"/>
  <text x="1570" y="596" font-size="15" fill="#0F766E" font-weight="700" text-anchor="middle">LLM  (답변 생성)</text>
  <text x="1570" y="620" font-size="13" fill="#0D9488" text-anchor="middle">Claude API  →  7단계: Qwen 로컬 전환 예정</text>

  <!-- ===================================== -->
  <!-- INTERFACE LAYER (BOTTOM)              -->
  <!-- ===================================== -->
  <text x="960" y="746" font-size="13" fill="#64748B" letter-spacing="2" font-weight="600" text-anchor="middle">인터페이스 레이어</text>

  <!-- Gradio -->
  <rect x="290" y="762" width="340" height="80" fill="#ECFDF5" rx="8" stroke="#6EE7D4" stroke-width="1.5"/>
  <text x="460" y="796" font-size="16" fill="#065F46" font-weight="700" text-anchor="middle">Gradio UI</text>
  <text x="460" y="822" font-size="13" fill="#0D9488" text-anchor="middle">localhost:7860</text>

  <!-- FastAPI -->
  <rect x="790" y="762" width="340" height="80" fill="#EFF6FF" rx="8" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="960" y="796" font-size="16" fill="#1E40AF" font-weight="700" text-anchor="middle">FastAPI</text>
  <text x="960" y="822" font-size="13" fill="#3B82F6" text-anchor="middle">localhost:8000  ·  /query /stream /health</text>

  <!-- Discord -->
  <rect x="1290" y="762" width="340" height="80" fill="#EDE9FE" rx="8" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="1460" y="796" font-size="16" fill="#4C1D95" font-weight="700" text-anchor="middle">Discord Bot</text>
  <text x="1460" y="822" font-size="13" fill="#7C3AED" text-anchor="middle">멘션 / 지정 채널 응답</text>

  <!-- Arrows from LLM to interfaces -->
  <!-- LLM center is x=1570, y=600. Arrow down to y=762 -->
  <!-- Fork: left to Gradio (460), center to FastAPI (960), right to Discord (1460) -->
  <line x1="1570" y1="636" x2="1570" y2="726" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Horizontal spread -->
  <line x1="460" y1="726" x2="1570" y2="726" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Down to each interface -->
  <line x1="460" y1="726" x2="460" y2="762" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="726" x2="960" y2="762" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1460" y1="726" x2="1460" y2="762" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Discord → FastAPI note -->
  <line x1="1290" y1="802" x2="1130" y2="802" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="1205" y="792" font-size="11" fill="#94A3B8" text-anchor="middle">HTTP 클라이언트</text>

  <!-- ===================================== -->
  <!-- LEGEND                                -->
  <!-- ===================================== -->
  <rect x="60" y="900" width="580" height="140" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="928" font-size="13" fill="#64748B" font-weight="700">범례 (Legend)</text>

  <rect x="80" y="942" width="14" height="14" fill="#DBEAFE" rx="2" stroke="#93C5FD" stroke-width="1"/>
  <text x="102" y="955" font-size="13" fill="#334155">인덱싱 컴포넌트</text>

  <rect x="80" y="966" width="14" height="14" fill="#F3E8FF" rx="2" stroke="#C4B5FD" stroke-width="1"/>
  <text x="102" y="979" font-size="13" fill="#334155">벡터 저장소</text>

  <rect x="80" y="990" width="14" height="14" fill="#CCFBF1" rx="2" stroke="#6EE7D4" stroke-width="1"/>
  <text x="102" y="1003" font-size="13" fill="#334155">질의·응답 컴포넌트</text>

  <line x1="260" y1="948" x2="300" y2="948" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="308" y="952" font-size="13" fill="#334155">벡터 데이터 흐름</text>

  <line x1="260" y1="972" x2="300" y2="972" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="308" y="976" font-size="13" fill="#334155">응답 흐름</text>

  <line x1="260" y1="996" x2="300" y2="996" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="308" y="1000" font-size="13" fill="#334155">Discord → FastAPI HTTP</text>

  <!-- Page number -->
  <text x="1860" y="1065" font-size="13" fill="#CBD5E1" text-anchor="end">-13-</text>
</svg>
