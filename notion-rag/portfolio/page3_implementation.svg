  <text x="1720" y="530" font-size="11" fill="#0D9488" text-anchor="middle">pgvector 검색</text>
  <text x="1720" y="548" font-size="11" fill="#0D9488" text-anchor="middle">Claude LLM</text>
  <text x="1720" y="566" font-size="11" fill="#0D9488" text-anchor="middle">스트리밍 응답</text>

  <!-- Gradio arrow to FastAPI -->
  <line x1="1180" y1="462" x2="1310" y2="480" stroke="#00C9A7" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="1242" y="460" font-size="11" fill="#00C9A7" text-anchor="middle">직접 호출</text>

  <!-- Result badge -->
  <rect x="990" y="580" width="860" height="58" fill="#ECFDF5" rx="6" stroke="#6EE7D4" stroke-width="1"/>
  <text x="1010" y="605" font-size="13" fill="#059669" font-weight="700">✅  성과</text>
  <text x="1010" y="626" font-size="14" fill="#064E3B">단일 RAG 백엔드 위에 Gradio · FastAPI · Discord 3채널 동시 운영  ·  Discord 2000자 자동 분할 포맷터 구현</text>

