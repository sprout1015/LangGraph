  <line x1="690" y1="864" x2="690" y2="1008" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="1230" y1="864" x2="1230" y2="1008" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Col 1 -->
  <text x="375" y="892" font-size="13" fill="#00C9A7" font-weight="700" text-anchor="middle">인덱싱 파이프라인</text>
  <text x="375" y="916" font-size="13" fill="#475569" text-anchor="middle">Notion API → 청크 분할 →</text>
  <text x="375" y="936" font-size="13" fill="#475569" text-anchor="middle">임베딩 → pgvector 자동 저장</text>
  <text x="375" y="960" font-size="13" fill="#475569" text-anchor="middle">reload_vectorstore.py 1회 실행으로</text>
  <text x="375" y="980" font-size="13" fill="#475569" text-anchor="middle">전체 파이프라인 재구성 가능</text>

  <!-- Col 2 -->
  <text x="960" y="892" font-size="13" fill="#3B82F6" font-weight="700" text-anchor="middle">품질 제어</text>
  <text x="960" y="916" font-size="13" fill="#475569" text-anchor="middle">score_threshold 유사도 필터 +</text>
