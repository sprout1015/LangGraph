  <text x="960" y="960" font-size="13" fill="#475569" text-anchor="middle">이중 LLM 호출 제거로</text>
  <text x="960" y="980" font-size="13" fill="#475569" text-anchor="middle">응답 속도 및 비용 개선</text>

