    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="5" height="1080" fill="#00C9A7"/>

  <!-- ===== HEADER ===== -->
  <text x="60" y="56" font-size="13" fill="#94A3B8" letter-spacing="3" font-weight="500">PROJECT 03 - IMPLEMENTATION</text>
  <text x="60" y="106" font-size="48" fill="#0F172A" font-weight="700">Notion RAG  –  핵심 구현 내용</text>
  <line x1="60" y1="122" x2="1860" y2="122" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ===== CENTER DIVIDER ===== -->
  <line x1="960" y1="132" x2="960" y2="760" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ============================================================ -->
  <!-- LEFT: 구현 내용 1 - score_threshold 유사도 필터링            -->
  <!-- ============================================================ -->

  <!-- Section tag -->
  <rect x="60" y="142" width="16" height="16" fill="#00C9A7" rx="3"/>
  <text x="84" y="155" font-size="14" fill="#0F172A" font-weight="700">구현 내용 1</text>

  <!-- Title -->
  <text x="60" y="192" font-size="22" fill="#0F172A" font-weight="700">score_threshold 기반 유사도 필터링</text>

  <!-- Problem box -->
  <rect x="60" y="210" width="860" height="72" fill="#FEF2F2" rx="6" stroke="#FECACA" stroke-width="1"/>
  <text x="80" y="234" font-size="13" fill="#DC2626" font-weight="700">📌  문제 상황</text>
  <text x="80" y="256" font-size="14" fill="#7F1D1D">score_threshold 미적용 시 유사도가 낮은 문서도 컨텍스트에 포함</text>
  <text x="80" y="274" font-size="14" fill="#7F1D1D">→ 관련 없는 내용이 섞인 답변 생성, 전체적인 LLM 응답 품질 저하</text>

  <!-- Approach box -->
  <rect x="60" y="298" width="860" height="72" fill="#F0FEFA" rx="6" stroke="#6EE7D4" stroke-width="1"/>
  <text x="80" y="322" font-size="13" fill="#00C9A7" font-weight="700">🔧  해결 접근</text>
  <text x="80" y="344" font-size="14" fill="#134E4A">pgvector similarity_search_with_score() 결과에 임계값 필터 적용</text>
  <text x="80" y="362" font-size="14" fill="#134E4A">→ score ≥ threshold 인 문서만 컨텍스트로 전달</text>

  <!-- Code-style diagram -->
  <rect x="60" y="386" width="860" height="178" fill="#F1F5F9" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="80" y="412" font-size="13" fill="#64748B" font-weight="600">vectorstore.py  –  유사도 필터 로직</text>
  <line x1="60" y1="422" x2="920" y2="422" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Code content -->
  <text x="80" y="446" font-size="13" fill="#8B5CF6" font-family="'Consolas', 'Monaco', monospace">def</text>
  <text x="115" y="446" font-size="13" fill="#1D4ED8" font-family="'Consolas', 'Monaco', monospace">similarity_search_with_threshold</text>
  <text x="450" y="446" font-size="13" fill="#334155" font-family="'Consolas', 'Monaco', monospace">(query, k=4, threshold=0.7):</text>

  <text x="80" y="470" font-size="13" fill="#475569" font-family="'Consolas', 'Monaco', monospace">    results = db.similarity_search_with_score(query, k=k)</text>
  <text x="80" y="492" font-size="13" fill="#475569" font-family="'Consolas', 'Monaco', monospace">    filtered = [(doc, score)</text>
  <text x="80" y="514" font-size="13" fill="#475569" font-family="'Consolas', 'Monaco', monospace">               <tspan fill="#059669">for</tspan> doc, score <tspan fill="#059669">in</tspan> results</text>
  <text x="80" y="536" font-size="13" fill="#475569" font-family="'Consolas', 'Monaco', monospace">               <tspan fill="#059669">if</tspan> score >= threshold]  <tspan fill="#64748B"># 임계값 이상만 통과</tspan></text>
  <text x="80" y="558" font-size="13" fill="#8B5CF6" font-family="'Consolas', 'Monaco', monospace">    return</text>
  <text x="130" y="558" font-size="13" fill="#475569" font-family="'Consolas', 'Monaco', monospace">[doc <tspan fill="#059669">for</tspan> doc, _ <tspan fill="#059669">in</tspan> filtered]</text>

  <!-- Result badge -->
  <rect x="60" y="580" width="860" height="58" fill="#ECFDF5" rx="6" stroke="#6EE7D4" stroke-width="1"/>
  <text x="80" y="605" font-size="13" fill="#059669" font-weight="700">✅  성과</text>
  <text x="80" y="626" font-size="14" fill="#064E3B">임계값 미달 문서 제거 → 컨텍스트 품질 향상  ·  소스 메타데이터에 카테고리 + Notion 원문 URL 포함</text>

  <!-- ============================================================ -->
  <!-- RIGHT: 구현 내용 2 - FastAPI 기반 다중 인터페이스 통합       -->
  <!-- ============================================================ -->

  <!-- Section tag -->
  <rect x="990" y="142" width="16" height="16" fill="#3B82F6" rx="3"/>
  <text x="1014" y="155" font-size="14" fill="#0F172A" font-weight="700">구현 내용 2</text>

  <!-- Title -->
  <text x="990" y="192" font-size="22" fill="#0F172A" font-weight="700">FastAPI 기반 다중 인터페이스 통합</text>

  <!-- Problem box -->
  <rect x="990" y="210" width="860" height="72" fill="#FEF2F2" rx="6" stroke="#FECACA" stroke-width="1"/>
  <text x="1010" y="234" font-size="13" fill="#DC2626" font-weight="700">📌  문제 상황</text>
  <text x="1010" y="256" font-size="14" fill="#7F1D1D">RAG 로직이 Gradio 코드에 결합되어 다른 채널(Discord 등)에서 재사용 불가</text>
  <text x="1010" y="274" font-size="14" fill="#7F1D1D">→ Discord 봇에서 동일 RAG를 사용하려면 코드 중복 필요</text>

  <!-- Approach box -->
  <rect x="990" y="298" width="860" height="72" fill="#EFF6FF" rx="6" stroke="#93C5FD" stroke-width="1"/>
  <text x="1010" y="322" font-size="13" fill="#3B82F6" font-weight="700">🔧  해결 접근</text>
  <text x="1010" y="344" font-size="14" fill="#1E3A5F">FastAPI 서버로 RAG 로직을 API화  →  각 인터페이스는 HTTP 클라이언트로 소비</text>
  <text x="1010" y="362" font-size="14" fill="#1E3A5F">Discord 봇(discord_bot/rag_client.py)에서 비동기 HTTP로 FastAPI 호출</text>

  <!-- Architecture diagram -->
  <rect x="990" y="386" width="860" height="178" fill="#F8FAFC" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1010" y="412" font-size="13" fill="#64748B" font-weight="600">인터페이스 통합 구조</text>
