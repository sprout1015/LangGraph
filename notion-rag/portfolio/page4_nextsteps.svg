  <!-- Lesson 1 -->
  <rect x="990" y="698" width="860" height="90" fill="#F0FEFA" rx="6" stroke="#6EE7D4" stroke-width="1"/>
  <text x="1010" y="722" font-size="13" fill="#0F766E" font-weight="700">RAG 품질은 검색 단계에서 결정된다</text>
  <text x="1010" y="744" font-size="13" fill="#334155">LLM 선택보다 청크 분할 전략과 score_threshold 튜닝이 답변 품질에 더 큰 영향을 미침</text>
  <text x="1010" y="766" font-size="13" fill="#334155">→ 임베딩 모델과 검색 파라미터 최적화가 RAG의 핵심 과제</text>

  <!-- Lesson 2 -->
  <rect x="990" y="800" width="860" height="90" fill="#EFF6FF" rx="6" stroke="#93C5FD" stroke-width="1"/>
  <text x="1010" y="824" font-size="13" fill="#1E40AF" font-weight="700">인터페이스 분리로 확장성 확보</text>
  <text x="1010" y="846" font-size="13" fill="#334155">FastAPI로 RAG를 API 서버화하면 Discord · Gradio · CLI 등 어떤 인터페이스도 HTTP로 연결 가능</text>
  <text x="1010" y="868" font-size="13" fill="#334155">→ 단일 RAG 백엔드 + 다중 프론트엔드 패턴의 실용적 가치 확인</text>

  <!-- Lesson 3 -->
  <rect x="990" y="902" width="860" height="90" fill="#F3E8FF" rx="6" stroke="#C4B5FD" stroke-width="1"/>
  <text x="1010" y="926" font-size="13" fill="#4C1D95" font-weight="700">로컬 LLM 전환의 현실적 장벽</text>
  <text x="1010" y="948" font-size="13" fill="#334155">Qwen 등 오픈소스 LLM은 GPU 없을 시 추론 속도가 실용적이지 않을 수 있음</text>
  <text x="1010" y="970" font-size="13" fill="#334155">→ 어댑터 패턴으로 Cloud API ↔ 로컬 LLM을 런타임에 교체 가능하도록 설계</text>

  <!-- Lesson 4 -->
  <rect x="990" y="1004" width="860" height="40" fill="#FEF9C3" rx="6" stroke="#FDE68A" stroke-width="1"/>
